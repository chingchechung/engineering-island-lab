<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d5e9df" />
    <meta name="description" content="Engineering Island Lab 3D 課程群島" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Engineering Island Lab</title>
  </head>
  <body>
    <header class="site-header">
      <h1 id="course-title">載入課程…</h1>
      <span id="course-summary" class="course-summary"></span>
      <button
        id="day-night"
        class="icon-button"
        aria-label="切換至夜晚模式"
        aria-pressed="false"
        title="切換至夜晚模式"
      >
        <span aria-hidden="true">☀</span>
      </button>
      <button id="about" class="icon-button" aria-label="操作說明">?</button>
    </header>
    <main>
      <section id="world" aria-label="3D 課程群島">
        <div id="canvas-host"></div>
        <div id="labels"></div>
        <div id="loading" role="status"><span class="loader"></span>正在喚醒小島…</div>
        <div id="tooltip" role="status" hidden></div>
      </section>
      <label class="unit-navigation"
        >單元導覽
        <select id="unit-navigation" aria-label="選擇島嶼">
          <option value="overview">群島總覽</option>
        </select>
      </label>
      <div class="view-toolbar" aria-label="地圖操作">
        <button id="overview" aria-label="返回總覽">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 12h8m-4-4v8" /></svg
          ><span>返回總覽</span>
        </button>
        <span class="toolbar-divider"></span>
        <button id="zoom-out" aria-label="縮小">−</button
        ><output id="zoom-level" aria-label="縮放倍率">100%</output
        ><button id="zoom-in" aria-label="放大">+</button>
      </div>
    </main>
    <footer class="site-footer">
      <span id="view-status" aria-live="polite">群島總覽</span
      ><span class="footer-help">左拖旋轉 · 右拖平移 · 滾輪縮放</span>
    </footer>
    <dialog id="detail-dialog" aria-labelledby="dialog-title">
      <div class="dialog-heading">
        <span class="eyebrow" id="dialog-kicker">探索筆記</span
        ><button id="close-dialog" class="icon-button" aria-label="關閉視窗">×</button>
      </div>
      <div class="dialog-scroll" role="region" aria-label="視窗內容" tabindex="0">
        <h2 id="dialog-title"></h2>
        <div id="dialog-content"></div>
      </div>
      <div class="dialog-footer">Engineering Island Lab · 課程群島</div>
    </dialog>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
